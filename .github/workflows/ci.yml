name: VeilLend CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Build, Lint & Test (Midnight Preprod)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Compact Contract AST & Interface Specification
        run: npm run compact:verify

      - name: Run TypeScript Typecheck
        run: npm run lint

      - name: Run Midnight ZK & Protocol Tests
        run: npm test

      - name: Build Production Frontend
        run: npm run build

      - name: Verify Production Bundle
        run: |
          test -f dist/index.html
          echo "Production build verified successfully."