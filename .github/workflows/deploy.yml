name: Deploy Preprod Testnet DApp

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'contracts/**'
      - 'public/**'

jobs:
  deploy:
    name: Deploy to Live Preprod Preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Build App
        run: npm run build

      - name: Verify Preprod Contract Integrity
        run: |
          node -e "
          const fs = require('fs');
          const spec = JSON.parse(fs.readFileSync('contracts/compiler-spec.json', 'utf8'));
          console.log('Deploying target:', spec.contractName, 'to', spec.target);
          "