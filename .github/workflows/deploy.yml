name: Build and Package Preprod DApp Release

# Note: Smart contract deployment is performed directly in-browser via the 1AM wallet extension
# on the dedicated /deploy route (zero funded server-side deployer keys needed).
# This workflow verifies contract integrity, runs the test suite, and builds the distribution bundle.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'contracts/**'
      - 'public/**'

jobs:
  build-and-verify:
    name: Build & Verify Preprod Release Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Compact Contract AST & Specification
        run: npm run compact:verify

      - name: Run Test Suite
        run: npm test

      - name: Build App
        run: npm run build

      - name: Verify Distribution Artifacts
        run: |
          test -f dist/index.html
          echo "Preprod release bundle built and validated successfully."